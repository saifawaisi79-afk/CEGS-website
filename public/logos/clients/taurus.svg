<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <!-- Taurus BPO Official emblem with text -->
  <g transform="translate(10, 5)">
    <!-- Red circle emblem with 3 diagonal bars -->
    <circle cx="25" cy="25" r="21" fill="none" stroke="#D32F2F" stroke-width="4.5" />
    <line x1="16" y1="33" x2="27" y2="18" stroke="#D32F2F" stroke-width="4" stroke-linecap="round" />
    <line x1="22" y1="35" x2="33" y2="20" stroke="#D32F2F" stroke-width="4" stroke-linecap="round" />
    <line x1="28" y1="37" x2="39" y2="22" stroke="#D32F2F" stroke-width="4" stroke-linecap="round" />
    
    <!-- TAURUS BPO brand typography -->
    <text x="58" y="27" fill="#1E293B" font-family="'Montserrat', 'Arial', sans-serif" font-size="19" font-weight="800" letter-spacing="1.5">TAURUS</text>
    <text x="59" y="44" fill="#D32F2F" font-family="'Montserrat', 'Arial', sans-serif" font-size="13" font-weight="800" letter-spacing="2">BPO</text>
  </g>
</svg>
